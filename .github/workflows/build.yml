# 推送和 PR 时：检查、测试、编译；推送 v 开头的标签（如 v0.1.0）时，另外把 exe 发布到 Releases。
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/island.exe dist/island.exe
          Compress-Archive -Path dist/island.exe, README.md, LICENSE -DestinationPath dist/island-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: island-windows-x64
          path: dist/island.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/island.exe
            dist/island-windows-x64.zip
          generate_release_notes: true
